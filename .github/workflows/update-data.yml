name: Aggiorna dati

on:
  schedule:
    # meteo (pioggia, umidità, quota): ogni giorno alle 05:00 UTC — dopo
    # la mezzanotte in Italia, quando i dati del giorno precedente sono
    # ormai definitivi e pronti prima che qualcuno pianifichi l'uscita
    - cron: "0 5 * * *"
    # storico ritrovamenti (GBIF + iNaturalist): ogni lunedì alle 04:00 UTC
    # — le nuove osservazioni citizen-science arrivano lentamente, un
    # aggiornamento giornaliero sarebbe solo carico inutile sulle API
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset da aggiornare manualmente"
        required: true
        default: "entrambi"
        type: choice
        options:
          - meteo
          - storico
          - notifiche
          - entrambi

permissions:
  contents: write

jobs:
  update-weather:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.dataset == 'meteo' || github.event.inputs.dataset == 'entrambi')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_weather_grid.py
      # pH del suolo: dato statico, quindi lo script è un no-op da pochi
      # secondi quando la cache è completa. Gira qui e non in un job a parte
      # perché deve vedere weather_grid.geojson appena riscritto: se il
      # meteo introduce celle nuove (confine ricalcolato, quota corretta)
      # il loro pH viene richiesto nella stessa esecuzione. Finché la cache
      # si sta riempiendo aggiunge al massimo ~25 minuti, e se SoilGrids è
      # giù lo script esce senza rompere l'aggiornamento meteo
      - run: python scripts/fetch_soil_ph.py
        continue-on-error: true
      - name: Commit se i dati sono cambiati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/weather_grid.geojson web/data/soil_ph.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna dati meteo e suolo (automatico)"
          # il job storico può aver spinto nel frattempo: senza rebase il
          # push fallirebbe e l'aggiornamento del giorno andrebbe perso
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1

  # notifiche pioggia sulle zone disegnate dagli utenti (vedi web/app.js):
  # job separato da update-weather perché non dipende affatto dalla
  # griglia meteo (interroga Open-Meteo punto per punto per conto suo) —
  # tenerlo insieme voleva dire aspettare il fetch della griglia, lento e
  # per nulla necessario, anche solo per un test manuale veloce. Se i
  # secret OneSignal non sono configurati lo script esce subito senza
  # fare nulla, quindi il job è sempre sicuro da eseguire
  notify-rain:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.dataset == 'notifiche' || github.event.inputs.dataset == 'entrambi')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # le notifiche calcolano quali funghi la pioggia mette in moto usando
      # web/model.js, cioè lo stesso modello del sito, eseguito con Node
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Notifiche pioggia
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/send_rain_notifications.py

  update-occurrences:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.dataset == 'storico' || github.event.inputs.dataset == 'entrambi')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_occurrences.py
      # vegetazione/quota reali per le celle con ritrovamenti: dipende dal
      # file appena scritto sopra, va rilanciato ogni volta che i
      # ritrovamenti cambiano così le celle nuove hanno subito il loro dato
      - run: python scripts/fetch_vegetation_fine.py
      # nuovi ritrovamenti = celle fini nuove, che hanno bisogno del loro pH
      - run: python scripts/fetch_soil_ph.py
        continue-on-error: true
      - name: Commit se i dati sono cambiati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/occurrences.geojson web/data/vegetation_fine.geojson web/data/soil_ph.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna dati storici GBIF/iNaturalist, vegetazione e suolo (automatico)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
