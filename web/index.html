<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mappa Funghi - Zone di calore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 11.5C3.5 6.8 7.3 3 12 3s8.5 3.8 8.5 8.5" />
        <path d="M3.5 11.5c0 1 .8 1.8 1.8 1.8h13.4c1 0 1.8-.8 1.8-1.8" />
        <path d="M9.5 13v5.5a2.5 2.5 0 0 0 5 0V13" />
      </svg>
      <h1>Mappa Funghi</h1>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="mode-switch" id="modeSwitch"></div>
      <button class="filters-toggle" id="filtersToggle" type="button" aria-expanded="false" aria-controls="filters" aria-label="Filtra specie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4" /></svg>
        <span class="filters-toggle-label">Specie</span>
        <span class="filters-toggle-count" id="filtersToggleCount"></span>
      </button>

      <div class="location-search" id="locationSearch">
        <button class="location-search-toggle" id="locationSearchToggle" type="button" aria-expanded="false" aria-controls="locationSearchInput" aria-label="Cerca una località">
          <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <form class="location-search-form" id="locationSearchForm" autocomplete="off">
          <svg class="location-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input class="location-search-input" id="locationSearchInput" type="text" placeholder="Cerca una località…" aria-label="Cerca una località" autocomplete="off" spellcheck="false" />
          <button class="location-search-clear" id="locationSearchClear" type="button" aria-label="Cancella ricerca">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </form>
        <ul class="location-search-results" id="locationSearchResults" hidden></ul>
      </div>
    </div>

    <div class="status" id="countBadge"></div>
  </header>

  <!-- fuori dall'header di proposito: .topbar crea un proprio contesto di
       impilamento (position:relative + z-index), quindi uno z-index alto
       su un elemento fixed annidato lì dentro resterebbe comunque
       "intrappolato" sotto altri elementi fixed fuori dall'header (come
       la legenda) — vedi anche filtersScrim qui sotto -->
  <div class="species-filters" id="filters"></div>
  <div class="filters-scrim" id="filtersScrim"></div>

  <main>
    <div id="map"></div>
    <div id="map3d" hidden></div>

    <div class="layer-menu" id="layerMenu">
      <button class="layer-toggle" id="layerToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Tipo di mappa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3 9 4.5-9 4.5-9-4.5Z" />
          <path d="m3 12 9 4.5 9-4.5" />
          <path d="m3 16.5 9 4.5 9-4.5" />
        </svg>
      </button>
      <ul class="layer-menu-list" id="layerMenuList" role="menu">
        <li role="none">
          <button type="button" role="menuitemradio" aria-checked="true" data-layer="street">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2Z" /><path d="M9 3v16" /><path d="M15 5v16" /></svg>
            <span>Standard</span>
          </button>
        </li>
        <li role="none">
          <button type="button" role="menuitemradio" aria-checked="false" data-layer="satellite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="8.5" cy="10.5" r="1.5" /><path d="m21 15-5-5-4 4-3-3-6 6" /></svg>
            <span>Satellite</span>
          </button>
        </li>
        <li role="none">
          <button type="button" role="menuitemradio" aria-checked="false" data-layer="3d">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 18 5.5-9 3.5 5 2.5-3 6.5 7Z" /><path d="M3 18h18" /></svg>
            <span>Rilievo 3D</span>
          </button>
        </li>
      </ul>
    </div>

    <div class="legend" id="legend">
      <div class="legend-head">
        <h2 id="legendTitle">Densità storica ritrovamenti</h2>
        <button class="legend-info" id="legendInfoBtn" type="button" aria-expanded="false" aria-controls="legendDesc" aria-label="Cosa indica questa scala">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 10.5v5.5" /><path d="M12 7.5h.01" /></svg>
        </button>
      </div>
      <div class="bar"></div>
      <div class="labels"><span>bassa</span><span>alta</span></div>
      <p id="legendDesc"></p>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
